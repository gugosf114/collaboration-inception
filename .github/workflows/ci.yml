name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Compile scripts
        run: python -m compileall -q scripts postoffice
      - name: Check browser and side-panel JavaScript
        run: |
          node --check scripts/capture_browser.cjs
          node --check scripts/point_browser.cjs
          node --check scripts/review_sidepanel.cjs
          node --check scripts/review_extension_live.cjs
          node --check extension/background.js
          node --check extension/activity.js
          node --check extension/sidepanel.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"
      - name: Run tests
        run: python -m unittest discover -s tests -v
